html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Manrope,"Noto Sans Tamil",system-ui,sans-serif}
.lo{height:38px;width:auto;display:block}.hd{background:var(--ac);color:#0a0a0a;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lg{border:0;background:#0a0a0a;color:#ffc20e;border-radius:99px;padding:8px 11px;margin-left:5px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}.hd b{font-size:15px}.hd span{white-space:nowrap}
.w{max-width:640px;margin:0 auto;padding:14px 16px 96px}

.mu{color:var(--mu);font-size:13px}.er{color:var(--tx);font-weight:700;font-size:13px;margin:6px 0}
label,.lb{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:8px 0 4px}
.in{width:100%;height:46px;border:1.5px solid var(--bd);border-radius:12px;padding:0 12px;background:var(--cd);color:var(--tx);font:inherit}
textarea.in{height:auto;padding:10px}
.bt,.ol{height:46px;border-radius:12px;padding:0 16px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;margin:8px 0}
.bt{border:0;background:var(--ac);color:#0a0a0a}.fm .bt,form>.bt{width:100%}
.ol{border:2px solid var(--tx);background:transparent;color:var(--tx)}
.sg{display:flex;gap:6px;margin:8px 0}.sg button{flex:1;height:42px;border:1.5px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font-family:inherit;font-size:13px;font-weight:700}
.sg .on{background:var(--ac);color:#0a0a0a;border-color:var(--ac)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;border:1.5px solid var(--tx);white-space:nowrap}
.pl.verified,.pl.d{background:var(--ac);border-color:var(--ac);color:#0a0a0a}.pl.needs,.pl.k{background:var(--tx);color:var(--bg)}
.ac{background:var(--ac);color:#0a0a0a;border:0}.bar{height:8px;background:#0a0a0a33;border-radius:4px;margin-top:8px}.bar i{display:block;height:8px;background:#0a0a0a;border-radius:4px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gr .cd{margin:0}.bn{font-size:24px;font-weight:800}
.th{width:64px;height:64px;object-fit:cover;border-radius:10px;margin-top:6px}
.r{display:flex;gap:8px;margin-bottom:8px}.r .in:first-child{flex:2}.r .in{flex:1;min-width:0}
.ck{display:flex;gap:12px;align-items:center}.ck input{width:20px;height:20px}
.pg{display:flex;gap:6px;margin:6px 0}.pg i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.pg i.on{background:var(--tx)}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tb button{flex:1;border:0;background:none;color:var(--mu);padding:14px 2px;font-family:inherit;font-size:13px;font-weight:600}.tb .on{color:var(--tx);font-weight:800;box-shadow:inset 0 -3px var(--ac)}
.sg-b{height:44px;border:1.5px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--mu);font-family:inherit;font-size:13px;cursor:pointer}.sg-b.on{background:var(--ac);color:#0a0a0a;border-color:var(--ac);font-weight:800}
.hm{border:0;border-radius:8px;width:100%;height:40px;font-family:inherit;font-size:12px;font-weight:700;color:#0a0a0a;cursor:pointer}
#app{overflow-wrap:anywhere}.rw{flex-wrap:wrap}table.t{display:block;overflow-x:auto;max-width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
</style></head>

function body(){if(!U)return loginV();if(V.sid)return recV(V.sid);if(V.m)return MV(V.m);if(U.role=='staff')return staffHome();if(U.role=='alumni')return alumniV();if(U.role=='volunteer')return volHome();if(!P(U.id).done||V.wiz)return wizV();return{home:homeV,marks:marksV,docs:docsV,act:actV,more:moreV,prof:profV}[V.tab]()}
const tabs=()=>U&&U.role=='student'&&P(U.id).done&&!V.wiz&&!V.sid?`<div class="tb">${['home','marks','docs','act','more'].map(k=>`<button class="${V.tab==k?'on':''}" onclick="V.tab='${k}';V.m=null;draw()">${t(k)}</button>`).join('')}</div>`:'';

function loginV(){if(V.fg==1)return forgotV();if(V.fg==2)return resetV();if(V.fg==3)return volSignV();if(V.fg==4)return applyV();return `<img class="lo" style="height:96px;margin:6px auto" src="${LOGO}" alt=""><h1>${V.reg?t('reg'):t('login')}</h1><div class="sg">${['student','alumni','office','volunteer'].map(k=>`<button class="${V.type==k?'on':''}" onclick="V.type='${k}';draw()">${t(k)}</button>`).join('')}</div>
<form class="cd" onsubmit="return auth(event)"><label>${t('id')}<input class="in" name="id" required autocapitalize="characters" value="${E(V.lid||'')}" placeholder="Enter your Maatram ID"></label><label>${t('pw')}<input class="in" name="pw" type="password" required minlength="6"></label>${V.msg?`<p class="er">${E(V.msg)}</p>`:''}<button class="bt">${V.reg?t('reg'):t('login')}</button></form>
<button class="ol" onclick="V.reg=!V.reg;V.msg='';draw()">${V.reg?t('login'):t('reg')}</button> ${V.reg?'':`<button class="ol" onclick="V.fg=1;V.msg='';V.demo=null;draw()">${t('forgot')}</button> <button class="ol" onclick="V.fg=3;V.msg='';draw()">Become a volunteer</button> <button class="ol" onclick="V.fg=4;V.msg='';V.ap=null;V.mm='';V.aok='';draw()">Apply for admission</button>`}
<div class="cd mu">Pilot with sample data, saved only in this browser. First choose New registration with a demo ID and a password, then log in. Students: S001, S002. Mentors and alumni: M001, M002. Office team (choose Office): O001 office, A001 admin, C001 and C002 coordinators, R001 student representative. Outside supporters use Become a volunteer, and applicants use Apply for admission.</div>`}
async function auth(e){e.preventDefault();const f=new FormData(e.target),id=f.get('id').trim().toUpperCase(),h=await hx(f.get('pw')),r=R(id);V.msg='';V.lid=id;
if(V.reg){if(!r)V.msg='This Maatram ID is not on the list. Please contact the Maatram office.';else if(S.users[id])V.msg='Already registered. Please log in.';
else{const role=r.kind=='student'?'student':r.kind=='mentor'?'alumni':'staff';S.users[id]={pw:h,role};if(role=='student')S.prof[id]={name:r.name,mobile:r.mobile,college:r.college,course:r.course,year:r.year,done:false};save();return enter(id)}}
else{const u=S.users[id];if(!u||u.pw!=h)V.msg='Wrong Maatram ID or password.';else{const p=P(id);if(u.role=='student'&&p.year&&p.year+dur(p.course)<=new Date().getFullYear()){u.role='alumni';save()}
if({student:'student',alumni:'alumni',office:'staff',volunteer:'volunteer'}[V.type]!=u.role)V.msg='This ID is registered as '+u.role+'. Choose the matching login type.';else return enter(id)}}
draw()}
const mask=e=>e.replace(/^(.).*(@.*)$/,'$1***$2');
function forgotV(){return `<h1>${t('forgot')}</h1><p class="mu">Enter your Maatram ID and date of birth. If they match our records, we will email a reset link to the address we have for you.</p><form class="cd" onsubmit="return fgt(event)">${F('id','Maatram ID','','text','required')}${F('dob','Date of birth','','date','required')}<button class="bt">Send reset link</button></form>${V.msg?`<div class="cd">${E(V.msg)}</div>`:''}${V.demo?`<div class="cd mu">Demo only. A real app emails this link to ${E(V.demo.m)}. <button class="bt" onclick="V.fg=2;V.tok='${V.demo.t}';V.msg='';draw()">Open reset link</button></div>`:''}<button class="ol" onclick="V.fg=0;V.msg='';V.demo=null;draw()">${t('back')}</button>`}
function fgt(e){const f=fd(e),id=f.get('id').trim().toUpperCase(),r=R(id),p=P(id),dob=(r&&r.dob)||p.dob,em=(r&&r.email)||p.email;V.demo=null;S.resets=S.resets||{};
if(S.users[id]&&dob&&em&&dob==f.get('dob')){const k=uid()+uid()+uid();S.resets[k]={id,exp:Date.now()+18e5};V.demo={t:k,m:mask(em)};save()}
V.msg='If the details match our records, a reset link has been sent to the email on file. The link works once and expires in 30 minutes.';draw();return false}
function resetV(){return `<h1>Choose a new password</h1><form class="cd" onsubmit="return rst(event)"><label>New password<input class="in" name="a" type="password" required minlength="6"></label><label>Repeat password<input class="in" name="b" type="password" required minlength="6"></label>${V.msg?`<p class="er">${E(V.msg)}</p>`:''}<button class="bt">Save password</button></form>`}
async function rst(e){e.preventDefault();const f=new FormData(e.target),x=(S.resets||{})[V.tok];V.msg='';
if(!x||x.exp<Date.now())V.msg='This link has expired or was already used. Please ask for a new one.';else if(f.get('a')!=f.get('b'))V.msg='The two passwords do not match.';
else{S.users[x.id].pw=await hx(f.get('a'));delete S.resets[V.tok];save();V.fg=0;V.tok=null;V.demo=null;V.msg='Password changed. Please log in with your new password.';draw();return false}
draw();return false}
function enter(id){V.lid='';U={id,role:S.users[id].role,sub:(R(id)||{}).sub||''};V.tab='home';V.sid=null;V.step=0;V.msg='';draw()}

function wizV(){const u=U.id,p=P(u),q=S.par[u]||{},e=S.edu[u]||{},s=V.step,nx=s==5?'Finish':t('next');

if(s==0)h+=`<h1>Personal information</h1><form class="fm" onsubmit="return wiz(event)">${FILE('ph','Passport-size photo',p.photo)}${F('name','Full name',p.name,'text','required')}${F('dob','Date of birth',p.dob,'date')}${F('mobile','Mobile number',p.mobile,'tel')}${F('email','Email',p.email,'email')}${F('addr','Address',p.addr)}${F('college','College',p.college)}${F('course','Course',p.course)}${F('year','Year of joining',p.year,'number')}<button class="bt">${nx}</button></form>`;

else if(s<5){const st=['10th','11th','12th'][s-2],x=e[st]||{};h+=`<h1>${st} standard</h1><form class="fm" onsubmit="return wiz(event)">${F('school','School name',x.school)}${F('board','Board',x.board)}${F('yr','Year of passing',x.yr,'number')}${st=='11th'?F('pct','Marks or percentage',x.pct):SEL('med','Medium of study',['English','Tamil','Other'],x.med)+'<div class="lb">Subject-wise marks</div>'+SR(x.subs&&x.subs.length?x.subs:[{},{},{}])}<button class="bt">${nx}</button></form>`}
else{const ms=S.roster.filter(r=>r.kind=='mentor'&&r.college==p.college&&dur(r.course)==dur(p.course)),ch=S.links[u]||[];h+=`<h1>Choose your mentors</h1><p class="mu">Maatram has listed the mentors for ${E(p.college)} (${dur(p.course)==4?'engineering':'arts'}). Select yours. They can see your full record and verify your entries.</p><form class="fm" onsubmit="return wiz(event)">${ms.map(m=>`<label class="cd ck"><input type="checkbox" name="mn" value="${m.id}" ${ch.includes(m.id)?'checked':''}><span><b>${E(m.name)}</b><br><span class="mu">Alumnus · ${E(m.course)}</span></span></label>`).join('')||'<p class="mu">No mentors are listed for your college and stream yet. The Maatram office will add them.</p>'}<button class="bt">${nx}</button></form>`}

function wiz(e){const f=fd(e),u=U.id,p=S.prof[u],s=V.step;

TMP={};save();draw();return false}

function scaleImg(f,cb){const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,320/Math.max(m.width,m.height));c.width=m.width*s;c.height=m.height*s;c.getContext('2d').drawImage(m,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};m.onerror=()=>cb('file:'+f.name);m.src=r.result};r.readAsDataURL(f)}
function smartUp(f,cb){if(!f)return;const k=uid()+uid(),L=S.up[k]={exp:NOW()+3e5,types:['image/jpeg','image/png','application/pdf'],max:S.cfg.maxMB*1048576},no=why=>{delete S.up[k];cb({ok:false,why})};
 if(L.exp<NOW())return no('The upload link expired');
 if(!L.types.includes(f.type))return no('File type not allowed: '+(f.type||'unknown')+'. Use JPEG, PNG or PDF.');
 if(f.size>L.max)return no('File is too large: '+(f.size/1048576).toFixed(1)+' MB. The limit is '+S.cfg.maxMB+' MB.');
 const done=v=>{S.store['obj/'+k]=v;delete S.up[k];save();cb({ok:true,key:'obj/'+k})};f.type.startsWith('image/')?scaleImg(f,done):done('file:'+f.name)}

function evtV(){const vv=vis();return `${bk()}<h1>Event log</h1><p class="mu">Every important change is saved as an event in the same save as the change. Workers read events after their bookmark. Events from a transaction that is still running are held back, so a late commit is never skipped. A message key stops duplicate emails.</p>${MM()}`+['mailer','career'].map(n=>{const c=S.cons[n],behind=vv.filter(e=>after(c,e)).length;return `<div class="cd"><div class="rw"><b>${n} worker</b><span class="pl ${c.down?'needs':'verified'}">${c.down?'stopped':'running'}</span></div><div class="mu">Bookmark ${c.tx}:${c.seq} · ${behind} events waiting</div><div class="rw"><button class="ol" onclick="wk('${n}','run')">Run now</button><button class="ol" onclick="wk('${n}','start')">Replay from start</button><button class="ol" onclick="wk('${n}','down')">${c.down?'Restart':'Stop (outage)'}</button></div><label>Replay from a time<input class="in" id="rt_${n}" type="datetime-local"></label><button class="ol" onclick="wk('${n}','time')">Replay from this time</button></div>`}).join('')+`<div class="cd"><b>Out-of-order test</b><p class="mu">A slow transaction ${S.inflight.length?'is running':'is not running'}.</p><div class="rw"><button class="ol" onclick="slowB()">1. Start slow transaction</button><button class="ol" onclick="evTest()">2. Save another event</button><button class="ol" onclick="slowC()">3. Commit slow transaction</button></div><button class="ol" onclick="dupT()">Send the same event twice</button></div><h2>Recent events</h2><table class="t"><tr><th>Seq</th><th>Tx</th><th>Type</th><th>By</th></tr>${S.events.slice(-30).reverse().map(e=>`<tr><td>${e.seq}</td><td>${e.tx}</td><td>${E(e.type)}<br><span class="mu">${E(e.agg)}</span></td><td>${E(e.by||'')}</td></tr>`).join('')}</table><h2>Messages sent</h2>`+(S.notes.slice(-15).reverse().map(n=>`<div class="cd"><div class="mu">${n.ch} to ${E(NM(n.to))} · ${fmt(n.at)}</div>${E(n.msg)}</div>`).join('')||'<p class="mu">None yet.</p>')}

 else if(a=='start'||a=='time'){let tx=0,seq=0;if(a=='time'){const v=$('#rt_'+n).value,tt=v?new Date(v).getTime():0,prev=vis().filter(e=>e.at<tt).pop();if(prev){tx=prev.tx;seq=prev.seq}}c.tx=tx;c.seq=seq;if(n=='career'){S.hist={};S.cur={};S.cands={}}c.down=false}

const coOf=id=>((S.cur[id]||{}).name)||'';
const connRow=(a,b)=>S.conn.find(c=>c.from==a&&c.to==b);
const pairRow=(v,id)=>U.role=='alumni'?connRow(v,id):connRow(id,v);
const connState=(v,id)=>{const r=pairRow(v,id);return r?r.st:'none'};
const dirPool=()=>Object.keys(S.users).filter(id=>id!=U.id&&inDir(id)&&(U.role=='alumni'||S.users[id].role=='alumni'));
const connLbl=()=>{const n=U&&U.role=='student'?S.conn.filter(c=>c.to==U.id&&c.st=='pending').length:0;return 'Connections'+(n?' ('+n+' new)':'')};
function connReq(id){const v=U.id;if(!(U.role=='alumni'&&S.users[id]&&S.users[id].role=='student'&&inDir(id)&&!connRow(v,id)))return;
 S.conn.push({from:v,to:id,st:'pending',at:NOW()});
 note(id,'in app',NM(v)+' would like to connect with you. Open Connections to accept or decline.','conn|'+v+'|'+id);
 emit('connection.requested',v+':'+id,{to:id});save();keep()}
function connAns(from,ans){const r=connRow(from,U.id);if(!r||r.st!='pending'||U.role!='student')return;
 r.st=ans;r.at=NOW();
 if(ans=='accepted')note(from,'in app',NM(U.id)+' accepted your request. You are now connected.','connok|'+from+'|'+U.id);
 emit('connection.'+ans,from+':'+U.id,{});save();keep()}
const DQ=()=>V.dq||(V.dq={q:'',role:'',batch:'',college:'',stream:'',co:''});
function dq(k,v){DQ()[k]=v;const el=$('#dlist');if(el)el.innerHTML=dirList()}
function memCard(id){const r=R(id)||{},isA=S.users[id].role=='alumni',st=connState(U.id,id),co=coOf(id);
 const badge=`<span class="pl ${isA?'verified':''}">${isA?'Alumnus':'Student'}</span>`;let act='';
 if(U.role=='alumni'&&!isA){
  act=st=='none'?`<button class="bt" onclick="connReq('${id}')">Request to connect</button>`
     :st=='pending'?'<span class="mu">Request sent. Waiting for a reply.</span>'
     :st=='accepted'?'<span class="pl verified">Connected</span>'
     :'<span class="mu">Not connected</span>';
 }else if(U.role=='student'&&isA){
  act=st=='accepted'?'<span class="pl verified">Connected</span>'
     :st=='pending'?'<button class="ol" onclick="V.ctab=\'req\';draw()">Open request</button>'
     :'<span class="mu">Not connected</span>';
 }
 return `<div class="cd"><b>${E(NM(id))}</b> ${badge}<div class="mu">Joined ${E(r.year)} · ${E(r.college)} · ${streamOf(id)}${co?' · '+E(co):''}</div><div style="margin-top:8px">${act}</div></div>`}
function dirList(){const d=DQ(),q=(d.q||'').trim().toLowerCase();
 const ids=dirPool().filter(id=>{const r=R(id)||{};
  if(d.role&&S.users[id].role!=d.role)return false;
  if(d.batch&&String(r.year)!=d.batch)return false;
  if(d.college&&r.college!=d.college)return false;
  if(d.stream&&streamOf(id)!=d.stream)return false;
  if(d.co&&coOf(id)!=d.co)return false;
  if(q&&!(NM(id)+' '+(r.college||'')+' '+coOf(id)).toLowerCase().includes(q))return false;return true})
  .sort((a,b)=>NM(a).localeCompare(NM(b)));
 const none=dirPool().length?'<p class="mu">No one matches these filters. Clear a filter to see more.</p>':'<p class="mu">No members are listed yet. Students appear here after they switch on "Show me in the directory".</p>';
 return `<p class="mu">${ids.length} shown</p>`+(ids.map(memCard).join('')||none)}
function reqCard(c){const r=R(c.from)||{};return `<div class="cd"><b>${E(NM(c.from))}</b> <span class="pl verified">Alumnus</span><div class="mu">Joined ${E(r.year)} · ${E(r.college)}${coOf(c.from)?' · '+E(coOf(c.from)):''}</div><div class="rw" style="margin-top:8px"><button class="bt" onclick="connAns('${c.from}','accepted')">Accept</button><button class="ol" onclick="connAns('${c.from}','declined')">Decline</button></div></div>`}
function reqBody(){
 if(U.role=='student'){
  const inc=S.conn.filter(c=>c.to==U.id&&c.st=='pending'),acc=S.conn.filter(c=>c.to==U.id&&c.st=='accepted');
  return `<h2>Requests from alumni</h2>`+(inc.map(reqCard).join('')||'<p class="mu">No requests waiting. Alumni can send a request once you show your profile in the directory.</p>')
   +`<h2>Connected</h2>`+(acc.map(c=>{const r=R(c.from)||{};return `<div class="cd"><b>${E(NM(c.from))}</b><div class="mu">Alumnus · Joined ${E(r.year)} · ${E(r.college)}</div></div>`}).join('')||'<p class="mu">No connections yet.</p>');
 }
 const sent=S.conn.filter(c=>c.from==U.id);
 return `<h2>Requests you sent</h2>`+(sent.map(c=>{const r=R(c.to)||{};return `<div class="cd rw"><div><b>${E(NM(c.to))}</b><div class="mu">Student · Joined ${E(r.year)}</div></div>${c.st=='accepted'?'<span class="pl verified">Connected</span>':c.st=='pending'?'<span class="mu">Waiting for a reply</span>':'<span class="mu">Not connected</span>'}</div>`}).join('')||'<p class="mu">You have not sent any requests yet. Find students in the Directory tab.</p>')}
function connV(){const tab=V.ctab||'dir',pend=U.role=='student'?S.conn.filter(c=>c.to==U.id&&c.st=='pending').length:0;
 const tabs=`<div class="sg"><button class="${tab=='dir'?'on':''}" onclick="V.ctab='dir';draw()">Directory</button><button class="${tab=='req'?'on':''}" onclick="V.ctab='req';draw()">Requests${pend?' ('+pend+')':''}</button></div>`;
 if(tab=='req')return `${bk()}<h1>Connections</h1>${tabs}${reqBody()}`;
 const d=DQ(),pool=dirPool(),opts=(arr,val,lbl)=>arr.map(x=>`<option value="${E(x)}"${d[val]==x?' selected':''}>${E(lbl?lbl(x):x)}</option>`).join('');
 const years=[...new Set(pool.map(id=>(R(id)||{}).year).filter(Boolean))].sort(),cols=[...new Set(pool.map(id=>(R(id)||{}).college).filter(Boolean))].sort(),cos=[...new Set(pool.map(coOf).filter(Boolean))].sort();
 const vis=U.role=='alumni'?'On by default. Students can send you a request.':'Off by default. Alumni can see you only if you switch this on.';
 return `${bk()}<h1>Connections</h1>${tabs}
 ${visBox()}
 <div class="cd"><input class="in" aria-label="Search" placeholder="Search by name, college or company" value="${E(d.q)}" oninput="dq('q',this.value)">
  <div class="r" style="margin-top:8px">
   ${U.role=='alumni'?`<select class="in" aria-label="Type" onchange="dq('role',this.value)"><option value="">Any type</option><option value="alumni"${d.role=='alumni'?' selected':''}>Alumni</option><option value="student"${d.role=='student'?' selected':''}>Students</option></select>`:''}
   <select class="in" aria-label="Batch" onchange="dq('batch',this.value)"><option value="">Any batch</option>${opts(years,'batch',x=>'Joined '+x)}</select>
  </div>
  <div class="r">
   <select class="in" aria-label="College" onchange="dq('college',this.value)"><option value="">Any college</option>${opts(cols,'college')}</select>
   <select class="in" aria-label="Stream" onchange="dq('stream',this.value)"><option value="">Any stream</option><option${d.stream=='Engineering'?' selected':''}>Engineering</option><option${d.stream=='Arts'?' selected':''}>Arts</option></select>
  </div>
  ${cos.length?`<select class="in" aria-label="Company" onchange="dq('co',this.value)"><option value="">Any company</option>${opts(cos,'co')}</select>`:''}
 </div>
 <div id="dlist">${dirList()}</div>`}

/* ---- messaging with the under-18 rule (defaults, to be confirmed by Maatram) ---- */
S.msgs=S.msgs||[];S.reports=S.reports||[];S.gcons=S.gcons||{};
const ageOf=id=>{const d=(S.prof[id]||{}).dob;if(!d)return null;const b=new Date(d+'T00:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const isMinor=id=>{const a=ageOf(id);return a!==null&&a<18&&!!S.users[id]&&S.users[id].role=='student'};
const pairKey=(a,b)=>[a,b].sort().join('|');
const acceptedWith=(a,b)=>S.conn.some(c=>c.st=='accepted'&&((c.from==a&&c.to==b)||(c.from==b&&c.to==a)));
const isMentorOf=(alum,stu)=>(S.links[stu]||[]).includes(alum)&&!!S.users[alum]&&S.users[alum].role=='alumni';
function canMessage(a,b){if(!a||!b||a==b)return false;const ua=S.users[a],ub=S.users[b];if(!ua||!ub)return false;
 if(!['student','alumni'].includes(ua.role)||!['student','alumni'].includes(ub.role))return false;
 if(ua.role==ub.role)return false;
 const stu=ua.role=='student'?a:b,alum=ua.role=='student'?b:a;
 if(isMinor(stu))return isMentorOf(alum,stu);
 return acceptedWith(a,b)}
function partners(id){const out=new Set();
 S.conn.forEach(c=>{if(c.st!='accepted')return;if(c.from==id)out.add(c.to);if(c.to==id)out.add(c.from)});
 Object.keys(S.links||{}).forEach(stu=>(S.links[stu]||[]).forEach(alum=>{if(alum==id)out.add(stu);if(stu==id)out.add(alum)}));
 return [...out].filter(p=>canMessage(id,p))}
function threadMsgs(a,b){return S.msgs.filter(m=>(m.from==a&&m.to==b)||(m.from==b&&m.to==a))}
function sendMsg(to,text){const from=U.id,t=(text||'').trim();if(!t||t.length>500||!canMessage(from,to))return false;
 const m={id:Date.now()+Math.random(),from,to,text:t,at:NOW(),read:false,rep:false};S.msgs.push(m);
 note(to,'in app','You have a new message in Chats.','msg|'+m.id);emit('message.sent',pairKey(from,to),{msgId:m.id});save();return true}
function sendForm(e,p){e.preventDefault();const ok=sendMsg(p,new FormData(e.target).get('t'));V.mm=ok?'':'Message not sent. Check that you can chat with this person.';keep();return false}
function repMsg(id){const m=S.msgs.find(x=>x.id==id);if(!m||m.to!=U.id||m.rep)return;m.rep=true;
 S.reports.push({id:Date.now()+Math.random(),msg:m.id,by:U.id,at:NOW(),from:m.from,to:m.to,text:m.text,status:'open'});
 note('O001','in app','A message was reported. Open Safeguarding.','rep|'+m.id);emit('message.reported',String(m.id),{});save();keep()}
function resolveRep(id){const r=S.reports.find(x=>x.id==id);if(r){r.status='reviewed';save();keep()}}
function chatList(){const u=U.id,ps=partners(u);
 const rules=U.role=='alumni'?'You can chat with students you are connected with. You can chat with a student under 18 only if they chose you as a mentor.':'You can chat with people you are connected with. If you are under 18, you can chat only with the mentors you chose.';
 return `${bk()}<h1>Chats</h1><p class="mu">${rules}</p>`+(ps.map(p=>{const ms=threadMsgs(p,u),unread=ms.filter(m=>m.to==u&&!m.read).length,last=ms[ms.length-1];
  return `<div class="cd rw"><div><b>${E(NM(p))}</b>${unread?' <span class="pl verified">'+unread+' new</span>':''}<div class="mu">${last?E(last.text.slice(0,50)):'No messages yet'}</div></div><button class="ol" onclick="V.chatWith='${p}';draw()">Open</button></div>`}).join('')
  ||'<p class="mu">No chats yet. Chats open after a connection is accepted, or for a student under 18 with their chosen mentors.</p>')}
function chatThread(p){const u=U.id,ms=threadMsgs(p,u);ms.forEach(m=>{if(m.to==u)m.read=true});
 return `<button class="ol" onclick="V.chatWith=null;draw()">${t('back')}</button><h1>${E(NM(p))}</h1>${MM()}`
  +ms.map(m=>`<div class="cd" style="margin-left:${m.from==u?'36px':'0'};margin-right:${m.from==u?'0':'36px'}"><div class="mu">${m.from==u?'You':E(NM(p))} · ${E(m.at)}</div><div>${E(m.text)}</div>${m.to==u&&!m.rep?`<button class="x" onclick="repMsg('${m.id}')">Report</button>`:m.rep&&m.to==u?'<span class="mu">Reported to the office</span>':''}</div>`).join('')
  +(ms.length?'':'<p class="mu">No messages yet. Say hello.</p>')
  +`<form class="cd" onsubmit="return sendForm(event,'${p}')"><textarea class="in" name="t" rows="2" maxlength="500" aria-label="Message"></textarea><button class="bt">Send</button></form>`}
function chatV(){if(V.chatWith&&canMessage(U.id,V.chatWith))return chatThread(V.chatWith);V.chatWith=null;return chatList()}
function safeV(){if(!isOff())return '<p class="mu">Not available for your role.</p>';
 if(V.chatView){const [a,b]=V.chatView.split('|');return `<button class="ol" onclick="V.chatView=null;draw()">${t('back')}</button><h1>${E(NM(a))} and ${E(NM(b))}</h1><p class="mu">Read-only copy for the office. Default for review, to be confirmed by Maatram.</p>`
  +threadMsgs(a,b).map(m=>`<div class="cd"><div class="mu">${E(NM(m.from))} · ${E(m.at)}${m.rep?' · reported':''}</div><div>${E(m.text)}</div></div>`).join('')||'<p class="mu">No messages.</p>'}
 const th={};S.msgs.forEach(m=>{if(isMinor(m.from)||isMinor(m.to)){const k=pairKey(m.from,m.to);th[k]=th[k]||{k,n:0};th[k].n++}});
 const open=S.reports.filter(r=>r.status=='open').length;
 return `${bk()}<h1>Safeguarding</h1><p class="mu">Defaults, to be confirmed by Maatram: the office can read chats that involve a student under 18, and every reported message.</p>
 <h2>Reports (${open} open)</h2>`+(S.reports.slice().reverse().map(r=>`<div class="cd"><b>${E(NM(r.from))}</b> to ${E(NM(r.to))} · ${E(r.at)}<div>${E(r.text)}</div><div style="margin-top:8px">${r.status=='open'?`<button class="bt" onclick="resolveRep(${r.id})">Mark reviewed</button>`:'<span class="mu">Reviewed</span>'}</div></div>`).join('')||'<p class="mu">No reports.</p>')
 +`<h2>Chats involving students under 18</h2>`+(Object.values(th).map(x=>{const [a,b]=x.k.split('|');return `<div class="cd rw"><div><b>${E(NM(a))}</b> and <b>${E(NM(b))}</b><div class="mu">${x.n} messages</div></div><button class="ol" onclick="V.chatView='${x.k}';draw()">View</button></div>`}).join('')||'<p class="mu">None.</p>')}
function visBox(){const id=U.id,minor=isMinor(id),gc=minor?`<label class="cd ck"><input type="checkbox" ${S.gcons[id]?'checked':''} onchange="S.gcons['${id}']=this.checked?NOW():null;if(!this.checked)S.dirv['${id}']=false;save();keep()"><span><b>My parent or guardian has agreed</b><br><span class="mu">Needed before you can appear in the directory. The date is recorded.</span></span></label>`:'';
 const can=!minor||!!S.gcons[id];
 return gc+`<label class="cd ck"><input type="checkbox" ${inDir(id)?'checked':''} ${can?'':'disabled'} onchange="S.dirv['${id}']=this.checked;save();keep()"><span><b>Show me in the directory</b><br><span class="mu">${U.role=='alumni'?'On by default. Students can send you a request.':'Off by default. Alumni can see you only if you switch this on.'} Your contact details are never shown here.</span></span></label>`}

/* ---- office updates and events with RSVP (ideas from the reference review) ---- */
S.posts=S.posts||[];S.calev=S.calev||[];S.rsvp=S.rsvp||{};S.saved=S.saved||{};V.utab=V.utab||'all';V.cvt=V.cvt||'up';
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const rsvpOf=eid=>S.rsvp[eid]||{};
const goingN=eid=>Object.values(rsvpOf(eid)).filter(x=>x=='going').length;
const canRsvp=()=>!!U&&(U.role=='student'||U.role=='alumni');
function postUpd(e){e.preventDefault();if(!isOff())return false;const f=new FormData(e.target),title=(f.get('title')||'').trim(),body=(f.get('body')||'').trim();
 if(!title||!body||body.length>500)return false;
 const p={id:Date.now()+Math.random(),title,body,cat:f.get('cat'),by:U.id,at:NOW()};S.posts.push(p);
 Object.keys(S.users).forEach(id=>{const r=S.users[id].role;if(id!=U.id&&(r=='student'||r=='alumni'))note(id,'in app','New update from the Maatram office: '+title,'upd|'+p.id+'|'+id)});
 emit('update.posted',String(p.id),{});save();keep();return false}
function delUpd(id){if(!isOff())return;S.posts=S.posts.filter(p=>String(p.id)!=String(id));save();keep()}
function toggleSave(id){const k=U.id,sid=String(id);S.saved[k]=(S.saved[k]||[]).map(String);const i=S.saved[k].indexOf(sid);if(i<0)S.saved[k].push(sid);else S.saved[k].splice(i,1);save();keep()}
function updV(){const tab=V.utab||'all',saved=(S.saved[U.id]||[]).map(String),list=S.posts.slice().reverse(),shown=tab=='saved'?list.filter(p=>saved.includes(String(p.id))):list;
 const tabs=`<div class="sg"><button class="${tab=='all'?'on':''}" onclick="V.utab='all';draw()">All updates</button><button class="${tab=='saved'?'on':''}" onclick="V.utab='saved';draw()">Saved</button></div>`;
 const form=isOff()?`<form class="cd" onsubmit="return postUpd(event)"><b>Post an update</b>${F('title','Title','','text','required')}<label>Category<select class="in" name="cat">${['Admissions','Sessions','Volunteer calls','General'].map(c=>`<option>${c}</option>`).join('')}</select></label><label>Message<textarea class="in" name="body" rows="3" maxlength="500" required></textarea></label><button class="bt">Post update</button></form>`:'';
 const rows=shown.map(p=>`<div class="cd"><div class="rw"><b>${E(p.title)}</b><span class="pl">${E(p.cat)}</span></div><div class="mu">From the office · ${E(p.at)}</div><p style="margin:8px 0">${E(p.body)}</p><div class="rw"><button class="ol" onclick="toggleSave('${p.id}')">${saved.includes(String(p.id))?'Unsave':'Save'}</button>${isOff()?`<button class="x" onclick="delUpd('${p.id}')">Remove</button>`:''}</div></div>`).join('');
 return `${bk()}<h1>Updates</h1>${form}${tabs}${rows||`<p class="mu">${tab=='saved'?'You have not saved any updates yet.':'No updates yet. The office will post here.'}</p>`}`}
function setRsvp(eid,ans){const e=S.calev.find(x=>String(x.id)==String(eid));if(!e||!canRsvp())return;
 S.rsvp[eid]=S.rsvp[eid]||{};
 if(ans=='going'&&e.cap&&S.rsvp[eid][U.id]!='going'&&goingN(eid)>=e.cap)return;
 S.rsvp[eid][U.id]=ans;emit('event.rsvp',String(eid),{ans});save();keep()}
function postEv(e){e.preventDefault();if(!isOff())return false;const f=new FormData(e.target),title=(f.get('title')||'').trim(),date=f.get('date');
 if(!title||!date)return false;
 const ev={id:Date.now()+Math.random(),title,type:f.get('type'),date,time:f.get('time')||'',place:(f.get('place')||'').trim(),cap:+f.get('cap')||0,desc:(f.get('desc')||'').trim(),by:U.id};
 S.calev.push(ev);
 Object.keys(S.users).forEach(id=>{const r=S.users[id].role;if(id!=U.id&&(r=='student'||r=='alumni'))note(id,'in app','New event: '+title+' on '+date,'ev|'+ev.id+'|'+id)});
 emit('event.created',String(ev.id),{});save();keep();return false}
function delEv(id){if(!isOff())return;S.calev=S.calev.filter(x=>String(x.id)!=String(id));save();keep()}
function calV(){const tab=V.cvt||'up',today=todayS(),all=S.calev.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const up=all.filter(e=>e.date>=today),past=all.filter(e=>e.date<today).reverse(),list=tab=='past'?past:up;
 const tabs=`<div class="sg"><button class="${tab=='up'?'on':''}" onclick="V.cvt='up';draw()">Upcoming</button><button class="${tab=='past'?'on':''}" onclick="V.cvt='past';draw()">Past</button></div>`;
 const card=e=>{const g=goingN(e.id),mine=rsvpOf(e.id)[U.id],full=!!e.cap&&g>=e.cap&&mine!='going';
  const act=canRsvp()&&tab=='up'?`<div class="rw" style="margin-top:8px"><button class="${mine=='going'?'bt':'ol'}" onclick="setRsvp('${e.id}','going')" ${full?'disabled':''}>${mine=='going'?'Going':full?'Full':'Going'}</button><button class="${mine=='no'?'bt':'ol'}" onclick="setRsvp('${e.id}','no')">Not going</button></div>`:'';
  const names=Object.keys(rsvpOf(e.id)).filter(k=>rsvpOf(e.id)[k]=='going').map(k=>E(NM(k))).join(', ');
  const who=isOff()?`<div class="mu">Going: ${names||'nobody yet'}</div>`:'';
  return `<div class="cd"><div class="rw"><b>${E(e.title)}</b><span class="pl">${E(e.type)}</span></div><div class="mu">${E(e.date)}${e.time?' · '+E(e.time):''}${e.place?' · '+E(e.place):''} · ${g}${e.cap?' of '+e.cap:''} going</div>${e.desc?`<p style="margin:8px 0">${E(e.desc)}</p>`:''}${act}${who}${isOff()?`<button class="x" onclick="delEv('${e.id}')">Remove</button>`:''}</div>`};
 const form=isOff()?`<form class="cd" onsubmit="return postEv(event)"><b>New event</b>${F('title','Event name','','text','required')}<label>Type<select class="in" name="type">${['Give-back','Session','Career talk','Other'].map(c=>`<option>${c}</option>`).join('')}</select></label>${F('date','Date',todayS(),'date','required')}${F('time','Time','','time')}${F('place','Place','','text')}${F('cap','Places (0 means no limit)','0','number')}<label>Details<textarea class="in" name="desc" rows="2" maxlength="500"></textarea></label><button class="bt">Create event</button></form>`:'';
 return `${bk()}<h1>Events</h1>${form}${tabs}${list.map(card).join('')||`<p class="mu">${tab=='past'?'No past events.':'No upcoming events yet.'}</p>`}`}

const unreadN=()=>!U?0:S.notes.filter(n=>n.to==U.id&&!n.read).length;
function bellToggle(){V.bell=!V.bell;if(V.bell){S.notes.forEach(n=>{if(n.to==U.id)n.read=true});save()}draw()}
function bellBtn(){const n=unreadN();return `<button class="lg" aria-label="${n?'Notifications, '+n+' unread':'Notifications'}" onclick="bellToggle()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>${n?' '+n:''}</button>`}
function bellV(){const list=S.notes.filter(n=>n.to==U.id).slice(-20).reverse();
 return `<div class="cd" role="region" aria-label="Notifications"><div class="rw"><b>Notifications</b><button class="ol" onclick="V.bell=false;draw()">Close</button></div>`
  +(list.map(n=>`<div style="border-top:1px solid var(--bd);padding:8px 0"><div class="mu">${E(n.ch)} · ${E(n.at)}</div><div>${E(n.msg)}</div></div>`).join('')||'<p class="mu">No notifications yet.</p>')+`</div>`}
const onHomeNow=()=>!!U&&!V.sid&&!V.m&&!V.wiz&&(U.role=='alumni'||(U.role=='student'&&!!P(U.id).done&&(V.tab||'home')=='home'));
function askCard(){return `<div class="cd"><b>Need help?</b><p class="mu">Ask the office about admissions, scholarships, events, mentoring or anything else. You will get a reply in the app.</p><button class="bt" onclick="V.m='help';draw()">Ask the office</button></div>`}

ensure();draw();
</script></body></html>
